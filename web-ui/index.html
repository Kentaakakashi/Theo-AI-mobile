<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a12" />
    <title>Theo</title>
    <style>
      html,body,#root{width:100%;height:100%;margin:0;background:#080a12;color:#f4f6ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      body{overflow:hidden}
      #boot-status{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 38%,#182744 0%,#080a12 62%)}
      #boot-status .orb{width:46px;height:46px;border-radius:50%;border:1px solid #7bdfff88;box-shadow:0 0 35px #368dff44,inset 0 0 22px #368dff33;animation:breathe 2s ease-in-out infinite}
      #boot-status .title{font-size:20px;font-weight:600;letter-spacing:.22em}
      #boot-status .detail{max-width:280px;color:#aab5cb;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
      @keyframes breathe{50%{transform:scale(1.08);opacity:.6}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-status"><div class="orb"></div><div class="title">THEO</div><div class="detail" id="boot-detail">Loading interface…</div></div></div>
    <script>
      (function () {
        function showFailure(label, detail) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<div id="boot-status"><div class="orb"></div><div class="title">THEO</div><div class="detail"></div></div>';
          root.querySelector('.detail').textContent = label + ': ' + String(detail || 'Unknown error');
        }
        window.addEventListener('error', function (event) {
          if (event && (event.message || event.filename)) showFailure('Interface error', (event.message || event.filename) + (event.lineno ? ' (line ' + event.lineno + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (event) {
          showFailure('Interface startup error', event.reason && (event.reason.message || event.reason) || 'Promise rejected');
        });
        window.__theoShowFailure = showFailure;
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
