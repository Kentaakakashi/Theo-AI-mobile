name: Build Theo Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Theo
        uses: actions/checkout@v4

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase Android configuration restored for this build."
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set; build will compile without a connected Firebase project."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore stable debug signing keystore or create a temporary one
        env:
          THEO_DEBUG_KEYSTORE_BASE64: ${{ secrets.THEO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$THEO_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$THEO_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Stable debug signing keystore restored."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::THEO_DEBUG_KEYSTORE_BASE64 is not set. This build uses a temporary signing key; Google sign-in SHA fingerprints will not be stable between builds."
          fi

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: theo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
